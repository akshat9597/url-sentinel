services:
  - type: web
    name: byteforce-api-akshat9597
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: byteforce-db
          property: connectionString
      - key: BYTEFORCE_ENV
        value: production
      - key: BYTEFORCE_OBSERVATION_MODE
        value: "true"
      - key: BYTEFORCE_AUTH_ENABLED
        value: "true"
      - key: BYTEFORCE_SECRET_KEY
        generateValue: true
      - key: BYTEFORCE_ADMIN_EMAIL
        sync: false
      - key: BYTEFORCE_ADMIN_PASSWORD
        sync: false
      - key: BYTEFORCE_AUTO_SEED
        value: "false"
      - key: BYTEFORCE_BOOTSTRAP_MODEL
        value: "true"
      - key: BYTEFORCE_ALLOWED_ORIGINS
        sync: false
      - key: BYTEFORCE_TRUSTED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: BYTEFORCE_RETENTION_DAYS
        value: "90"
      - key: BYTEFORCE_MAX_UPLOAD_BYTES
        value: "26214400"
      - key: BYTEFORCE_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: BYTEFORCE_DEFAULT_HOST
        sync: false
      - key: BYTEFORCE_DEFAULT_DST_IP
        value: "127.0.0.1"

databases:
  - name: byteforce-db
    plan: free
    region: singapore
    databaseName: byteforce
    user: byteforce
